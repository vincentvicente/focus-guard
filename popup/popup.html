<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Focus Guard</title>
  <link rel="stylesheet" href="popup.css">
</head>
<body>
  <div class="container">
    <!-- Header -->
    <header class="header">
      <div class="logo">
        <span class="logo-icon">◉</span>
        <span class="logo-text">FOCUS</span>
      </div>
      <button class="settings-btn" id="settingsBtn">
        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
          <circle cx="12" cy="12" r="3"></circle>
          <path d="M12 1v2M12 21v2M4.22 4.22l1.42 1.42M18.36 18.36l1.42 1.42M1 12h2M21 12h2M4.22 19.78l1.42-1.42M18.36 5.64l1.42-1.42"></path>
        </svg>
      </button>
    </header>

    <!-- Setup View -->
    <div class="view" id="setupView">
      <!-- Timer Selection -->
      <div class="section">
        <label class="section-label">专注时长</label>
        <div class="time-options">
          <button class="time-btn" data-minutes="25">25</button>
          <button class="time-btn active" data-minutes="45">45</button>
          <button class="time-btn" data-minutes="60">60</button>
          <button class="time-btn custom" id="customTimeBtn">
            <input type="number" id="customTime" min="1" max="180" placeholder="?" class="custom-input">
          </button>
        </div>
        <span class="time-unit">分钟</span>
      </div>

      <!-- Focus Pages -->
      <div class="section">
        <label class="section-label">专注页面</label>
        <div class="focus-pages" id="focusPages">
          <!-- Dynamic content -->
        </div>
        <button class="add-page-btn" id="addCurrentPage">
          <span class="plus">+</span> 添加当前页面
        </button>
      </div>

      <!-- Start Button -->
      <button class="start-btn" id="startBtn">
        <span class="btn-text">开始专注</span>
        <span class="btn-glow"></span>
      </button>
    </div>

    <!-- Focus View -->
    <div class="view hidden" id="focusView">
      <div class="timer-ring">
        <svg class="progress-ring" viewBox="0 0 120 120">
          <circle class="progress-ring-bg" cx="60" cy="60" r="54"/>
          <circle class="progress-ring-fill" cx="60" cy="60" r="54" id="progressRing"/>
        </svg>
        <div class="timer-display">
          <span class="timer-time" id="timerDisplay">45:00</span>
          <span class="timer-label">剩余时间</span>
        </div>
      </div>

      <div class="focus-stats">
        <div class="stat">
          <span class="stat-value" id="distractionCount">0</span>
          <span class="stat-label">分心次数</span>
        </div>
      </div>

      <div class="focus-actions">
        <button class="action-btn pause" id="pauseBtn">
          <svg width="20" height="20" viewBox="0 0 24 24" fill="currentColor">
            <rect x="6" y="4" width="4" height="16"></rect>
            <rect x="14" y="4" width="4" height="16"></rect>
          </svg>
          暂停
        </button>
        <button class="action-btn stop" id="stopBtn">
          <svg width="20" height="20" viewBox="0 0 24 24" fill="currentColor">
            <rect x="4" y="4" width="16" height="16" rx="2"></rect>
          </svg>
          结束
        </button>
      </div>
    </div>

    <!-- Settings View -->
    <div class="view hidden" id="settingsView">
      <div class="settings-header">
        <button class="back-btn" id="backBtn">
          <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
            <path d="M19 12H5M12 19l-7-7 7-7"></path>
          </svg>
        </button>
        <h2>设置</h2>
      </div>

      <div class="settings-list">
        <div class="setting-item">
          <span class="setting-label">声音提醒</span>
          <label class="toggle">
            <input type="checkbox" id="soundEnabled" checked>
            <span class="toggle-slider"></span>
          </label>
        </div>
        <div class="setting-item">
          <span class="setting-label">系统通知</span>
          <label class="toggle">
            <input type="checkbox" id="notifyEnabled" checked>
            <span class="toggle-slider"></span>
          </label>
        </div>
        <div class="setting-item disabled">
          <span class="setting-label">白名单 <span class="coming-soon">即将推出</span></span>
          <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" opacity="0.3">
            <path d="M9 18l6-6-6-6"></path>
          </svg>
        </div>
      </div>
    </div>
  </div>

  <script src="popup.js"></script>
</body>
</html>
